specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Instagram
providerId: instagram
created: '2026-05-04'
# Provenance stamped 2026-08-11: this artifact was written by the API Evangelist
# bulk sweep dated 2026-05-04, not harvested from the provider. See roadmap#35.
method: generated
modified: '2026-05-05'
reconciled: true
tags:
  - Instagram
  - Meta
  - Social Media
  - Rate Limiting
description: Instagram Platform inherits Meta Graph API rate limiting. Two regimes apply - Platform Rate
  Limits (Graph API requests with app or user access tokens) and Business Use Case (BUC) Rate Limits
  (Marketing API, Instagram Platform, Pages API requests with system / page tokens). Standard endpoints
  are sized as "4800 * Number of Impressions" calls per 24-hour rolling window. Messaging and reply
  endpoints have specific per-second / per-account limits. Throttling decisions are surfaced via X-App-Usage
  and X-Business-Use-Case-Usage headers and via specific error codes.
sources:
  - https://developers.facebook.com/docs/instagram-api/overview
  - https://developers.facebook.com/docs/graph-api/overview/rate-limiting
headers:
  appUsage: X-App-Usage
  businessUseCaseUsage: X-Business-Use-Case-Usage
  retryAfter: Retry-After
responseCodes:
  appRateLimitReached: 4
  userRateLimitReached: 17
  pageThrottled: 80001
  instagramThrottled: 80002
  messengerThrottled: 80006
  throttled: 429
  serviceUnavailable: 503
limits:
  - name: Platform Rate Limits (app token)
    scope: app
    metric: requests_per_hour
    limit: 200 * Number of Users
    timeFrame: hour
    notes: Calls within one hour = 200 * Number of Users. X-App-Usage tracks call_count, total_cputime,
      and total_time as percentages; throttling engages when any reaches 100.
    applies:
      - Instagram Graph API
  - name: Standard endpoints (rolling window)
    scope: app
    metric: requests_per_day
    limit: 4800 * Number of Impressions
    timeFrame: day
    notes: 24-hour rolling window. Applies to standard Instagram Platform endpoints.
    applies:
      - Instagram Graph API
  - name: Business Discovery / Hashtag Search
    scope: app
    metric: varies
    limit: separate Platform Rate Limits apply per Business Use Case
    applies:
      - Instagram Business Discovery
      - Instagram Hashtag Search
  - name: Conversations API messaging
    scope: account
    metric: requests_per_second
    limit: 2
    timeFrame: second
    applies:
      - Conversations / Messenger for Instagram
  - name: Live replies
    scope: account
    metric: requests_per_second
    limit: 100
    timeFrame: second
    applies:
      - Conversations / Messenger for Instagram
  - name: Post / reel replies
    scope: account
    metric: requests_per_hour
    limit: 750
    timeFrame: hour
    applies:
      - Conversations / Messenger for Instagram
policies:
  - name: Backoff Strategy
    description: When throttled, stop making calls (continued calls prolong recovery). Honor Retry-After
      and recheck X-App-Usage / X-Business-Use-Case-Usage before resuming.
  - name: Header-Driven Pacing
    description: Read X-App-Usage and X-Business-Use-Case-Usage on every response and pace requests so
      call_count, total_cputime, and total_time stay below 100.
  - name: Filter Aggressively
    description: Use field expansion sparingly and request only needed fields to reduce CPU-time consumption
      against the limit.
  - name: App Review Gating
    description: Higher-throughput access (Advanced Access) requires Meta App Review and Business Verification
      rather than a paid tier upgrade.
maintainers:
