description: FOCUS-aligned FinOps shape for Instagram Platform APIs. The APIs themselves are free; there
  is no Meta-issued invoice for API call volume. FinOps practice for Instagram-consuming apps therefore
  focuses on rate-limit budget consumption (treating X-App-Usage and BUC headers as the de-facto meter)
  and on the consuming app's own infrastructure cost (storage of media, egress, compute), plus any
  Instagram Ads (Marketing API) spend which is separately governed.
notes: No direct Meta charge for Instagram Graph API usage. The 'meter' here is the rate-limit budget;
  treat X-App-Usage and X-Business-Use-Case-Usage as canonical telemetry. Instagram Ads spend should
  be tracked separately via the Marketing API.
sources:
  - https://developers.facebook.com/docs/instagram-api/overview
  - https://developers.facebook.com/docs/graph-api/overview/rate-limiting
principles:
  - name: Visibility
    description: Log X-App-Usage and X-Business-Use-Case-Usage on every Graph API response and chart
      call_count / total_cputime / total_time burn against the per-hour and per-day windows.
  - name: Allocation
    description: Allocate API budget by feature / account; tag requests in your own infrastructure with
      the consuming product so per-feature rate-limit consumption can be reviewed.
  - name: Optimization
    description: Filter fields, batch with Field Expansion judiciously, cache identifiers like Instagram
      Business Account IDs, and prefer webhooks over polling to reduce calls.
  - name: Accountability
    description: Designate a Platform owner per app; review monthly App Review approvals, BUC tier upgrades,
      and incident counts (4 / 17 / 80001 / 80002 / 80006 errors) in product reviews.
