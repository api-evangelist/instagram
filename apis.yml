  - type: Features
    data:
    - name: Content Publishing
      description: Publish photos, videos, reels, carousels, and stories to Instagram
        Business and Creator accounts programmatically.
    - name: Media Management
      description: Retrieve, manage, and organize published media including photos,
        videos, stories, and albums.
    - name: Comment Moderation
      description: Read, reply to, hide, and delete comments on Instagram media for
        brand safety and engagement.
    - name: Hashtag Discovery
      description: Search for hashtags and discover top and recent media associated
        with specific hashtags.
    - name: Mention Tracking
      description: Identify and retrieve media where your account has been mentioned
        by other Instagram users.
    - name: Insights and Analytics
      description: Access account-level and media-level metrics for reach, impressions,
        engagement, and audience demographics.
    - name: Instagram Direct Messaging
      description: Send and receive messages through Instagram Direct for customer service
        and business communication.
    - name: Stories Publishing
      description: Publish ephemeral story content including photos and videos that
        disappear after 24 hours.
    - name: Reels Publishing
      description: Create and publish short-form video content as Instagram Reels.
    - name: oEmbed
      description: Embed Instagram posts, reels, and videos on third-party websites
        using the standard oEmbed protocol.
    - name: Webhooks
      description: Receive real-time notifications for comments, mentions, messages,
        and story insights via webhooks.
    - name: Private Replies
      description: Send private direct messages in response to public comments on your
        Instagram media.
  - type: UseCases
    data:
    - name: Social Media Management
      description: Automate content publishing, scheduling, and media management across
        Instagram accounts.
    - name: Brand Monitoring
      description: Track mentions, comments, and hashtags to monitor brand sentiment
        and engagement.
    - name: Customer Service
      description: Manage Instagram Direct conversations for customer support and business
        inquiries.
    - name: Analytics and Reporting
      description: Retrieve insights and metrics for measuring content performance and
        audience growth.
    - name: Content Curation
      description: Discover and curate content through hashtag search and mention tracking.
    - name: E-commerce Integration
      description: Connect product catalogs and shopping features with Instagram content
        for social commerce.
    - name: Influencer Marketing
      description: Track creator account metrics, media performance, and audience insights
        for influencer campaigns.
    - name: Website Embedding
      description: Embed Instagram posts, reels, and galleries on websites and blogs
        using oEmbed.
  - type: Integrations
    data:
    - name: Facebook
      description: Unified management of Instagram and Facebook content, messaging,
        and advertising through the Meta platform.
    - name: Meta Business Suite
      description: Centralized dashboard for managing Instagram and Facebook business
        accounts, content, and insights.
    - name: WhatsApp
      description: Cross-platform messaging through Meta unified messaging infrastructure.
    - name: Webhooks
      description: Real-time event notifications for comments, mentions, messages, and
        story insights.
  - type: Solutions
    data:
    - name: Instagram API with Instagram Login
      description: Native Instagram authentication for Business and Creator accounts
        with full API access.
    - name: Instagram API with Facebook Login
      description: Facebook Page-linked authentication for Instagram Business accounts
        with hashtag discovery.
    - name: Instagram Messaging
      description: Unified messaging across Instagram Direct and Facebook Messenger
        for business communication.
    - name: Instagram Embedding
      description: oEmbed and embed tools for displaying Instagram content on third-party
        websites.
