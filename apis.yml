aid: instagram
name: Instagram
description: Instagram is a photo and video sharing social networking platform owned
  by Meta. The Instagram APIs allow developers to build integrations with Instagram
  Business and Creator accounts for content publishing, media management, comment
  moderation, hashtag discovery, insights and analytics, messaging, and embedding.
  Available through the Meta Developer Platform with Facebook Login or Instagram Login
  authentication.
