method: probed
source: live GET probes of every apis.yml baseURL host, every OpenAPI servers[] host, the docs host, and the OAuth authorization host declared in the specs' oauth2 securityScheme
description: >-
  Probe of the standard /.well-known/ surface across every host in this repo. One real document
  was served: the OpenID Connect discovery document at www.facebook.com. That host is in scope
  because it is the authorization host the Instagram specs themselves declare - every Instagram
  OpenAPI in openapi/ carries oauth2.flows.authorizationCode.authorizationUrl =
  https://www.facebook.com/dialog/oauth - and it is the documented login path for "Instagram API
  with Facebook Login".
false_positives:
  - host: www.instagram.com
    note: >-
      The Instagram web app answers HTTP 200 with a ~620KB single-page-app HTML shell for EVERY
      /.well-known/* path, including agent-card.json, api-catalog, openid-configuration and
      security.txt. None of these is a document; all are recorded as misses below with
      status 200 and a note, per the SPA catch-all rule.
  - host: graph.instagram.com
    note: >-
      Returns HTTP 400 with an IGApiException "Invalid OAuth 2.0 Access Token" JSON body for every
      path, including /.well-known/*. The Graph host has no unauthenticated document surface.
