naftiko: 1.0.0-alpha2
info:
  label: Instagram Graph API — Comments
  description: 'Instagram Graph API — Comments. 7 operations. Lead operation: Instagram Get Comment. Self-contained Naftiko
    capability covering one Instagram business surface.'
  tags:
  - Instagram
  - Comments
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    INSTAGRAM_API_KEY: INSTAGRAM_API_KEY
capability:
  consumes:
  - type: http
    namespace: graph-comments
    baseUri: https://graph.facebook.com/v21.0
    description: Instagram Graph API — Comments business capability. Self-contained, no shared references.
    resources:
    - name: comment_id
      path: /{comment_id}
      operations:
      - name: getcomment
        method: GET
        description: Instagram Get Comment
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: comment_id
          in: path
          type: string
          required: true
        - name: fields
          in: query
          type: string
        - name: access_token
          in: query
          type: string
          required: true
      - name: hidecomment
        method: POST
        description: Instagram Hide or Unhide Comment
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: comment_id
          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
      - name: deletecomment
        method: DELETE
        description: Instagram Delete Comment
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: comment_id
          in: path
          type: string
          required: true
        - name: access_token
          in: query
          type: string
          required: true
    - name: comment_id-replies
      path: /{comment_id}/replies
      operations:
      - name: getcommentreplies
        method: GET
        description: Instagram Get Comment Replies
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: comment_id
          in: path
          type: string
          required: true
        - name: fields
          in: query
          type: string
        - name: access_token
          in: query
          type: string
          required: true
      - name: createcommentreply
        method: POST
        description: Instagram Create Comment Reply
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: comment_id
          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: media_id-comments
      path: /{media_id}/comments
      operations:
      - name: getmediacomments
        method: GET
        description: Instagram Get Media Comments
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: media_id
          in: path
          type: string
          required: true
        - name: fields
          in: query
          type: string
        - name: access_token
          in: query
          type: string
          required: true
      - name: createcomment
        method: POST
        description: Instagram Create Comment
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: media_id
          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.INSTAGRAM_API_KEY}}'
  exposes:
  - type: rest
    namespace: graph-comments-rest
    port: 8080
    description: REST adapter for Instagram Graph API — Comments. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/{comment-id}
      name: comment-id
      description: REST surface for comment_id.
      operations:
      - method: GET
        name: getcomment
        description: Instagram Get Comment
        call: graph-comments.getcomment
        with:
          comment_id: rest.comment_id
          fields: rest.fields
          access_token: rest.access_token
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: hidecomment
        description: Instagram Hide or Unhide Comment
        call: graph-comments.hidecomment
        with:
          comment_id: rest.comment_id
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deletecomment
        description: Instagram Delete Comment
        call: graph-comments.deletecomment
        with:
          comment_id: rest.comment_id
          access_token: rest.access_token
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/{comment-id}/replies
      name: comment-id-replies
      description: REST surface for comment_id-replies.
      operations:
      - method: GET
        name: getcommentreplies
        description: Instagram Get Comment Replies
        call: graph-comments.getcommentreplies
        with:
          comment_id: rest.comment_id
          fields: rest.fields
          access_token: rest.access_token
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createcommentreply
        description: Instagram Create Comment Reply
        call: graph-comments.createcommentreply
        with:
          comment_id: rest.comment_id
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/{media-id}/comments
      name: media-id-comments
      description: REST surface for media_id-comments.
      operations:
      - method: GET
        name: getmediacomments
        description: Instagram Get Media Comments
        call: graph-comments.getmediacomments
        with:
          media_id: rest.media_id
          fields: rest.fields
          access_token: rest.access_token
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createcomment
        description: Instagram Create Comment
        call: graph-comments.createcomment
        with:
          media_id: rest.media_id
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: graph-comments-mcp
    port: 9090
    transport: http
    description: MCP adapter for Instagram Graph API — Comments. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: instagram-get-comment
      description: Instagram Get Comment
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: graph-comments.getcomment
      with:
        comment_id: tools.comment_id
        fields: tools.fields
        access_token: tools.access_token
      outputParameters:
      - type: object
        mapping: $.
    - name: instagram-hide-unhide-comment
      description: Instagram Hide or Unhide Comment
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: graph-comments.hidecomment
      with:
        comment_id: tools.comment_id
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: instagram-delete-comment
      description: Instagram Delete Comment
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: graph-comments.deletecomment
      with:
        comment_id: tools.comment_id
        access_token: tools.access_token
      outputParameters:
      - type: object
        mapping: $.
    - name: instagram-get-comment-replies
      description: Instagram Get Comment Replies
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: graph-comments.getcommentreplies
      with:
        comment_id: tools.comment_id
        fields: tools.fields
        access_token: tools.access_token
      outputParameters:
      - type: object
        mapping: $.
    - name: instagram-create-comment-reply
      description: Instagram Create Comment Reply
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: graph-comments.createcommentreply
      with:
        comment_id: tools.comment_id
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: instagram-get-media-comments
      description: Instagram Get Media Comments
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: graph-comments.getmediacomments
      with:
        media_id: tools.media_id
        fields: tools.fields
        access_token: tools.access_token
      outputParameters:
      - type: object
        mapping: $.
    - name: instagram-create-comment
      description: Instagram Create Comment
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: graph-comments.createcomment
      with:
        media_id: tools.media_id
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
