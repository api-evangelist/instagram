naftiko: "1.0.0-alpha1"

info:
  label: "Instagram Community Engagement"
  description: >-
    Unified workflow for managing Instagram community interactions including
    comment moderation, replies, hashtag discovery, and mention tracking. Used by
    community managers and social media teams to engage with followers, moderate
    comments, discover trending content via hashtags, and monitor brand mentions.
  tags:
    - Instagram
    - Community Engagement
    - Social Media
    - Comments
    - Hashtags
    - Mentions
  created: "2026-04-18"
  modified: "2026-04-18"

binds:
  - namespace: env
    keys:
      INSTAGRAM_ACCESS_TOKEN: INSTAGRAM_ACCESS_TOKEN

capability:
  consumes:
    - import: instagram-graph
      location: ./shared/instagram-graph-api.yaml

  exposes:
    - type: rest
      port: 8081
      namespace: instagram-engagement-api
      description: "Unified REST API for Instagram community engagement workflows."
      resources:
        - path: /v1/media/{media_id}/comments
          name: media-comments
          description: "Comments on a media object."
          operations:
            - method: GET
              name: get-media-comments
              description: "Get comments on an Instagram media object."
              call: "instagram-graph.get-media-comments"
              with:
                media_id: "rest.media_id"
                fields: "rest.fields"
                access_token: "rest.access_token"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: POST
              name: create-comment
              description: "Create a comment on an Instagram media object."
              call: "instagram-graph.create-comment"
              with:
                media_id: "rest.media_id"
                message: "rest.message"
                access_token: "rest.access_token"
              outputParameters:
                - type: object
                  mapping: "$."

        - path: /v1/comments/{comment_id}
          name: comment
          description: "Individual comment operations."
          operations:
            - method: GET
              name: get-comment
              description: "Get fields on an Instagram comment."
              call: "instagram-graph.get-comment"
              with:
                comment_id: "rest.comment_id"
                fields: "rest.fields"
                access_token: "rest.access_token"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: POST
              name: hide-comment
              description: "Hide or unhide a comment on your media."
              call: "instagram-graph.hide-comment"
              with:
                comment_id: "rest.comment_id"
                hide: "rest.hide"
                access_token: "rest.access_token"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: DELETE
              name: delete-comment
              description: "Delete a comment on your media."
              call: "instagram-graph.delete-comment"
              with:
                comment_id: "rest.comment_id"
                access_token: "rest.access_token"
              outputParameters:
                - type: object
                  mapping: "$."

        - path: /v1/comments/{comment_id}/replies
          name: comment-replies
          description: "Replies to a comment."
          operations:
            - method: GET
              name: get-comment-replies
              description: "Get replies to a comment."
              call: "instagram-graph.get-comment-replies"
              with:
                comment_id: "rest.comment_id"
                fields: "rest.fields"
                access_token: "rest.access_token"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: POST
              name: create-comment-reply
              description: "Reply to a comment."
              call: "instagram-graph.create-comment-reply"
              with:
                comment_id: "rest.comment_id"
                message: "rest.message"
                access_token: "rest.access_token"
              outputParameters:
                - type: object
                  mapping: "$."

        - path: /v1/hashtags/search
          name: hashtag-search
          description: "Search for hashtags."
          operations:
            - method: GET
              name: search-hashtag
              description: "Search for a hashtag by name and get its ID."
              call: "instagram-graph.search-hashtag"
              with:
                q: "rest.q"
                user_id: "rest.user_id"
                access_token: "rest.access_token"
              outputParameters:
                - type: object
                  mapping: "$."

        - path: /v1/hashtags/{hashtag_id}/top-media
          name: hashtag-top-media
          description: "Top media for a hashtag."
          operations:
            - method: GET
              name: get-hashtag-top-media
              description: "Get the most popular media tagged with a specific hashtag."
              call: "instagram-graph.get-hashtag-top-media"
              with:
                hashtag_id: "rest.hashtag_id"
                user_id: "rest.user_id"
                fields: "rest.fields"
                access_token: "rest.access_token"
              outputParameters:
                - type: object
                  mapping: "$."

        - path: /v1/hashtags/{hashtag_id}/recent-media
          name: hashtag-recent-media
          description: "Recent media for a hashtag."
          operations:
            - method: GET
              name: get-hashtag-recent-media
              description: "Get the most recently published media tagged with a specific hashtag."
              call: "instagram-graph.get-hashtag-recent-media"
              with:
                hashtag_id: "rest.hashtag_id"
                user_id: "rest.user_id"
                fields: "rest.fields"
                access_token: "rest.access_token"
              outputParameters:
                - type: object
                  mapping: "$."

        - path: /v1/users/{user_id}/tags
          name: user-tags
          description: "Media where user was tagged."
          operations:
            - method: GET
              name: get-user-tags
              description: "Get IG Media objects where the user has been tagged by other users."
              call: "instagram-graph.get-user-tags"
              with:
                user_id: "rest.user_id"
                fields: "rest.fields"
                access_token: "rest.access_token"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9091
      namespace: instagram-engagement-mcp
      transport: http
      description: "MCP server for AI-assisted Instagram community engagement."
      tools:
        - name: get-media-comments
          description: "Get comments on an Instagram media object."
          hints:
            readOnly: true
            idempotent: true
          call: "instagram-graph.get-media-comments"
          with:
            media_id: "tools.media_id"
            fields: "tools.fields"
            access_token: "tools.access_token"
          outputParameters:
            - type: object
              mapping: "$."

        - name: create-comment
          description: "Create a comment on an Instagram media object."
          hints:
            readOnly: false
            destructive: false
            idempotent: false
          call: "instagram-graph.create-comment"
          with:
            media_id: "tools.media_id"
            message: "tools.message"
            access_token: "tools.access_token"
          outputParameters:
            - type: object
              mapping: "$."

        - name: get-comment
          description: "Get fields on an Instagram comment."
          hints:
            readOnly: true
            idempotent: true
          call: "instagram-graph.get-comment"
          with:
            comment_id: "tools.comment_id"
            fields: "tools.fields"
            access_token: "tools.access_token"
          outputParameters:
            - type: object
              mapping: "$."

        - name: hide-comment
          description: "Hide or unhide a comment on your media."
          hints:
            readOnly: false
            idempotent: true
          call: "instagram-graph.hide-comment"
          with:
            comment_id: "tools.comment_id"
            hide: "tools.hide"
            access_token: "tools.access_token"
          outputParameters:
            - type: object
              mapping: "$."

        - name: delete-comment
          description: "Delete a comment on your media."
          hints:
            readOnly: false
            destructive: true
            idempotent: true
          call: "instagram-graph.delete-comment"
          with:
            comment_id: "tools.comment_id"
            access_token: "tools.access_token"
          outputParameters:
            - type: object
              mapping: "$."

        - name: get-comment-replies
          description: "Get replies to a comment."
          hints:
            readOnly: true
            idempotent: true
          call: "instagram-graph.get-comment-replies"
          with:
            comment_id: "tools.comment_id"
            fields: "tools.fields"
            access_token: "tools.access_token"
          outputParameters:
            - type: object
              mapping: "$."

        - name: create-comment-reply
          description: "Reply to a comment."
          hints:
            readOnly: false
            destructive: false
            idempotent: false
          call: "instagram-graph.create-comment-reply"
          with:
            comment_id: "tools.comment_id"
            message: "tools.message"
            access_token: "tools.access_token"
          outputParameters:
            - type: object
              mapping: "$."

        - name: search-hashtag
          description: "Search for a hashtag by name and get its ID."
          hints:
            readOnly: true
            idempotent: true
          call: "instagram-graph.search-hashtag"
          with:
            q: "tools.q"
            user_id: "tools.user_id"
            access_token: "tools.access_token"
          outputParameters:
            - type: object
              mapping: "$."

        - name: get-hashtag-top-media
          description: "Get the most popular media tagged with a specific hashtag."
          hints:
            readOnly: true
            idempotent: true
          call: "instagram-graph.get-hashtag-top-media"
          with:
            hashtag_id: "tools.hashtag_id"
            user_id: "tools.user_id"
            fields: "tools.fields"
            access_token: "tools.access_token"
          outputParameters:
            - type: object
              mapping: "$."

        - name: get-hashtag-recent-media
          description: "Get the most recently published media tagged with a specific hashtag."
          hints:
            readOnly: true
            idempotent: true
          call: "instagram-graph.get-hashtag-recent-media"
          with:
            hashtag_id: "tools.hashtag_id"
            user_id: "tools.user_id"
            fields: "tools.fields"
            access_token: "tools.access_token"
          outputParameters:
            - type: object
              mapping: "$."

        - name: get-user-tags
          description: "Get IG Media objects where the user has been tagged by other users."
          hints:
            readOnly: true
            idempotent: true
          call: "instagram-graph.get-user-tags"
          with:
            user_id: "tools.user_id"
            fields: "tools.fields"
            access_token: "tools.access_token"
          outputParameters:
            - type: object
              mapping: "$."
