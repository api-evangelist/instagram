naftiko: 1.0.0-alpha2
info:
  label: Instagram Analytics And Insights
  description: Unified workflow for Instagram analytics and insights including account-level metrics, media-level performance
    data, user profile analysis, and competitor research via business discovery. Used by marketing analysts and social media
    strategists to measure content performance, track audience growth, and benchmark against competitors.
  tags:
  - Instagram
  - Analytics
  - Insights
  - Social Media
  - Reporting
  created: '2026-04-18'
  modified: '2026-05-06'
binds:
- namespace: env
  keys:
    INSTAGRAM_ACCESS_TOKEN: INSTAGRAM_ACCESS_TOKEN
capability:
  consumes:
  - type: http
    namespace: instagram-graph
    baseUri: https://graph.facebook.com/v21.0
    description: Instagram Graph API for managing Business and Creator accounts.
    authentication:
      type: bearer
      token: '{{INSTAGRAM_ACCESS_TOKEN}}'
    resources:
    - name: users
      path: /
      description: Instagram Business and Creator account profiles.
      operations:
      - name: get-user
        method: GET
        path: /{user_id}
        description: Get fields and edges on an Instagram Business or Creator account.
        inputParameters:
        - name: user_id
          in: path
          type: string
          required: true
          description: The Instagram user ID.
        - name: fields
          in: query
          type: string
          required: false
          description: Comma-separated list of fields to return.
        - name: access_token
          in: query
          type: string
          required: true
          description: User access token.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-business-discovery
        method: GET
        path: /{user_id}/business_discovery
        description: Get data about other Instagram Business or Creator accounts.
        inputParameters:
        - name: user_id
          in: path
          type: string
          required: true
          description: The Instagram user ID.
        - name: fields
          in: query
          type: string
          required: true
          description: Must include business_discovery.fields().
        - name: access_token
          in: query
          type: string
          required: true
          description: User access token.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: media
      path: /
      description: Photos, videos, stories, reels, and carousels.
      operations:
      - name: get-user-media
        method: GET
        path: /{user_id}/media
        description: Get a collection of IG Media objects published on the account.
        inputParameters:
        - name: user_id
          in: path
          type: string
          required: true
          description: The Instagram user ID.
        - name: fields
          in: query
          type: string
          required: false
          description: Comma-separated list of fields.
        - name: limit
          in: query
          type: integer
          required: false
          description: Maximum number of results per page.
        - name: after
          in: query
          type: string
          required: false
          description: Cursor for pagination.
        - name: access_token
          in: query
          type: string
          required: true
          description: User access token.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-user-stories
        method: GET
        path: /{user_id}/stories
        description: Get a collection of story IG Media objects on the account.
        inputParameters:
        - name: user_id
          in: path
          type: string
          required: true
          description: The Instagram user ID.
        - name: fields
          in: query
          type: string
          required: false
          description: Comma-separated list of fields.
        - name: access_token
          in: query
          type: string
          required: true
          description: User access token.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-media
        method: GET
        path: /{media_id}
        description: Get fields on an Instagram photo, video, story, reel, or album.
        inputParameters:
        - name: media_id
          in: path
          type: string
          required: true
          description: The IG Media ID.
        - name: fields
          in: query
          type: string
          required: false
          description: Comma-separated list of fields.
        - name: access_token
          in: query
          type: string
          required: true
          description: User access token.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: update-media
        method: POST
        path: /{media_id}
        description: Enable or disable comments on a media object.
        inputParameters:
        - name: media_id
          in: path
          type: string
          required: true
          description: The IG Media ID.
        body:
          type: json
          data:
            comment_enabled: '{{tools.comment_enabled}}'
            access_token: '{{tools.access_token}}'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: delete-media
        method: DELETE
        path: /{media_id}
        description: Delete an Instagram media object (post, story, reel, or carousel).
        inputParameters:
        - name: media_id
          in: path
          type: string
          required: true
          description: The IG Media ID.
        - name: access_token
          in: query
          type: string
          required: true
          description: User access token.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-media-children
        method: GET
        path: /{media_id}/children
        description: Get media objects within a carousel album.
        inputParameters:
        - name: media_id
          in: path
          type: string
          required: true
          description: The IG Media ID.
        - name: fields
          in: query
          type: string
          required: false
          description: Comma-separated list of fields.
        - name: access_token
          in: query
          type: string
          required: true
          description: User access token.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: publishing
      path: /
      description: Content creation and publishing workflow.
      operations:
      - name: create-media-container
        method: POST
        path: /{user_id}/media
        description: Create a media container for publishing content. Step 1 of the publishing flow.
        inputParameters:
        - name: user_id
          in: path
          type: string
          required: true
          description: The Instagram user ID.
        body:
          type: json
          data:
            image_url: '{{tools.image_url}}'
            video_url: '{{tools.video_url}}'
            caption: '{{tools.caption}}'
            media_type: '{{tools.media_type}}'
            is_carousel_item: '{{tools.is_carousel_item}}'
            location_id: '{{tools.location_id}}'
            access_token: '{{tools.access_token}}'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: publish-media
        method: POST
        path: /{user_id}/media_publish
        description: Publish a media container. Step 2 of the publishing flow.
        inputParameters:
        - name: user_id
          in: path
          type: string
          required: true
          description: The Instagram user ID.
        body:
          type: json
          data:
            creation_id: '{{tools.creation_id}}'
            access_token: '{{tools.access_token}}'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-content-publishing-limit
        method: GET
        path: /{user_id}/content_publishing_limit
        description: Get current content publishing usage and rate limit status.
        inputParameters:
        - name: user_id
          in: path
          type: string
          required: true
          description: The Instagram user ID.
        - name: fields
          in: query
          type: string
          required: false
          description: Comma-separated list of fields.
        - name: access_token
          in: query
          type: string
          required: true
          description: User access token.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-container
        method: GET
        path: /{container_id}
        description: Check the publishing status of a media container.
        inputParameters:
        - name: container_id
          in: path
          type: string
          required: true
          description: The container ID.
        - name: fields
          in: query
          type: string
          required: false
          description: Comma-separated list of fields.
        - name: access_token
          in: query
          type: string
          required: true
          description: User access token.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: comments
      path: /
      description: Comment management and moderation.
      operations:
      - name: get-media-comments
        method: GET
        path: /{media_id}/comments
        description: Get comments on an Instagram media object.
        inputParameters:
        - name: media_id
          in: path
          type: string
          required: true
          description: The IG Media ID.
        - name: fields
          in: query
          type: string
          required: false
          description: Comma-separated list of fields.
        - name: access_token
          in: query
          type: string
          required: true
          description: User access token.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-comment
        method: POST
        path: /{media_id}/comments
        description: Create a comment on an Instagram media object.
        inputParameters:
        - name: media_id
          in: path
          type: string
          required: true
          description: The IG Media ID.
        body:
          type: json
          data:
            message: '{{tools.message}}'
            access_token: '{{tools.access_token}}'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-comment
        method: GET
        path: /{comment_id}
        description: Get fields on an Instagram comment.
        inputParameters:
        - name: comment_id
          in: path
          type: string
          required: true
          description: The comment ID.
        - name: fields
          in: query
          type: string
          required: false
          description: Comma-separated list of fields.
        - name: access_token
          in: query
          type: string
          required: true
          description: User access token.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: hide-comment
        method: POST
        path: /{comment_id}
        description: Hide or unhide a comment on your media.
        inputParameters:
        - name: comment_id
          in: path
          type: string
          required: true
          description: The comment ID.
        body:
          type: json
          data:
            hide: '{{tools.hide}}'
            access_token: '{{tools.access_token}}'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: delete-comment
        method: DELETE
        path: /{comment_id}
        description: Delete a comment on your media.
        inputParameters:
        - name: comment_id
          in: path
          type: string
          required: true
          description: The comment ID.
        - name: access_token
          in: query
          type: string
          required: true
          description: User access token.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-comment-replies
        method: GET
        path: /{comment_id}/replies
        description: Get replies to a comment.
        inputParameters:
        - name: comment_id
          in: path
          type: string
          required: true
          description: The comment ID.
        - name: fields
          in: query
          type: string
          required: false
          description: Comma-separated list of fields.
        - name: access_token
          in: query
          type: string
          required: true
          description: User access token.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-comment-reply
        method: POST
        path: /{comment_id}/replies
        description: Reply to a comment.
        inputParameters:
        - name: comment_id
          in: path
          type: string
          required: true
          description: The comment ID.
        body:
          type: json
          data:
            message: '{{tools.message}}'
            access_token: '{{tools.access_token}}'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: hashtags
      path: /
      description: Hashtag search and media discovery.
      operations:
      - name: search-hashtag
        method: GET
        path: /ig_hashtag_search
        description: Search for a hashtag by name and get its ID.
        inputParameters:
        - name: q
          in: query
          type: string
          required: true
          description: 'The hashtag to search for (without #).'
        - name: user_id
          in: query
          type: string
          required: true
          description: The ID of the user making the request.
        - name: access_token
          in: query
          type: string
          required: true
          description: User access token.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-hashtag-top-media
        method: GET
        path: /{hashtag_id}/top_media
        description: Get the most popular media tagged with a specific hashtag.
        inputParameters:
        - name: hashtag_id
          in: path
          type: string
          required: true
          description: The hashtag ID.
        - name: user_id
          in: query
          type: string
          required: true
          description: The ID of the user making the request.
        - name: fields
          in: query
          type: string
          required: false
          description: Comma-separated list of fields.
        - name: access_token
          in: query
          type: string
          required: true
          description: User access token.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-hashtag-recent-media
        method: GET
        path: /{hashtag_id}/recent_media
        description: Get the most recently published media tagged with a specific hashtag.
        inputParameters:
        - name: hashtag_id
          in: path
          type: string
          required: true
          description: The hashtag ID.
        - name: user_id
          in: query
          type: string
          required: true
          description: The ID of the user making the request.
        - name: fields
          in: query
          type: string
          required: false
          description: Comma-separated list of fields.
        - name: access_token
          in: query
          type: string
          required: true
          description: User access token.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: insights
      path: /
      description: Account and media level analytics.
      operations:
      - name: get-user-insights
        method: GET
        path: /{user_id}/insights
        description: Get social interaction metrics for the account.
        inputParameters:
        - name: user_id
          in: path
          type: string
          required: true
          description: The Instagram user ID.
        - name: metric
          in: query
          type: string
          required: true
          description: Comma-separated list of metrics.
        - name: period
          in: query
          type: string
          required: true
          description: Time period for aggregation (day, week, days_28, month, lifetime).
        - name: since
          in: query
          type: integer
          required: false
          description: Unix timestamp for start of range.
        - name: until
          in: query
          type: integer
          required: false
          description: Unix timestamp for end of range.
        - name: access_token
          in: query
          type: string
          required: true
          description: User access token.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-media-insights
        method: GET
        path: /{media_id}/insights
        description: Get social interaction metrics for a media object.
        inputParameters:
        - name: media_id
          in: path
          type: string
          required: true
          description: The IG Media ID.
        - name: metric
          in: query
          type: string
          required: true
          description: Comma-separated list of metrics.
        - name: access_token
          in: query
          type: string
          required: true
          description: User access token.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: mentions
      path: /
      description: Content where account was mentioned.
      operations:
      - name: get-user-tags
        method: GET
        path: /{user_id}/tags
        description: Get IG Media objects where the user has been tagged by other users.
        inputParameters:
        - name: user_id
          in: path
          type: string
          required: true
          description: The Instagram user ID.
        - name: fields
          in: query
          type: string
          required: false
          description: Comma-separated list of fields.
        - name: access_token
          in: query
          type: string
          required: true
          description: User access token.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8082
    namespace: instagram-analytics-api
    description: Unified REST API for Instagram analytics and insights workflows.
    resources:
    - path: /v1/users/{user_id}
      name: user-profile
      description: User profile data.
      operations:
      - method: GET
        name: get-user
        description: Get fields and edges on an Instagram Business or Creator account.
        call: instagram-graph.get-user
        with:
          user_id: rest.user_id
          fields: rest.fields
          access_token: rest.access_token
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/users/{user_id}/business-discovery
      name: business-discovery
      description: Competitor and business account research.
      operations:
      - method: GET
        name: get-business-discovery
        description: Get data about other Instagram Business or Creator accounts.
        call: instagram-graph.get-business-discovery
        with:
          user_id: rest.user_id
          fields: rest.fields
          access_token: rest.access_token
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/users/{user_id}/insights
      name: user-insights
      description: Account-level analytics.
      operations:
      - method: GET
        name: get-user-insights
        description: Get social interaction metrics for the account.
        call: instagram-graph.get-user-insights
        with:
          user_id: rest.user_id
          metric: rest.metric
          period: rest.period
          since: rest.since
          until: rest.until
          access_token: rest.access_token
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/media/{media_id}/insights
      name: media-insights
      description: Media-level analytics.
      operations:
      - method: GET
        name: get-media-insights
        description: Get social interaction metrics for a media object.
        call: instagram-graph.get-media-insights
        with:
          media_id: rest.media_id
          metric: rest.metric
          access_token: rest.access_token
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/users/{user_id}/media
      name: user-media
      description: User media for analytics review.
      operations:
      - method: GET
        name: get-user-media
        description: Get a collection of IG Media objects published on the account.
        call: instagram-graph.get-user-media
        with:
          user_id: rest.user_id
          fields: rest.fields
          limit: rest.limit
          after: rest.after
          access_token: rest.access_token
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/media/{media_id}
      name: media
      description: Individual media detail for analytics.
      operations:
      - method: GET
        name: get-media
        description: Get fields on an Instagram media object.
        call: instagram-graph.get-media
        with:
          media_id: rest.media_id
          fields: rest.fields
          access_token: rest.access_token
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9092
    namespace: instagram-analytics-mcp
    transport: http
    description: MCP server for AI-assisted Instagram analytics and insights.
    tools:
    - name: get-user
      description: Get fields and edges on an Instagram Business or Creator account.
      hints:
        readOnly: true
        idempotent: true
      call: instagram-graph.get-user
      with:
        user_id: tools.user_id
        fields: tools.fields
        access_token: tools.access_token
      outputParameters:
      - type: object
        mapping: $.
    - name: get-business-discovery
      description: Get data about other Instagram Business or Creator accounts.
      hints:
        readOnly: true
        idempotent: true
      call: instagram-graph.get-business-discovery
      with:
        user_id: tools.user_id
        fields: tools.fields
        access_token: tools.access_token
      outputParameters:
      - type: object
        mapping: $.
    - name: get-user-insights
      description: Get social interaction metrics for the account.
      hints:
        readOnly: true
        idempotent: true
      call: instagram-graph.get-user-insights
      with:
        user_id: tools.user_id
        metric: tools.metric
        period: tools.period
        since: tools.since
        until: tools.until
        access_token: tools.access_token
      outputParameters:
      - type: object
        mapping: $.
    - name: get-media-insights
      description: Get social interaction metrics for a media object.
      hints:
        readOnly: true
        idempotent: true
      call: instagram-graph.get-media-insights
      with:
        media_id: tools.media_id
        metric: tools.metric
        access_token: tools.access_token
      outputParameters:
      - type: object
        mapping: $.
    - name: get-user-media
      description: Get a collection of IG Media objects published on the account.
      hints:
        readOnly: true
        idempotent: true
      call: instagram-graph.get-user-media
      with:
        user_id: tools.user_id
        fields: tools.fields
        limit: tools.limit
        after: tools.after
        access_token: tools.access_token
      outputParameters:
      - type: object
        mapping: $.
    - name: get-media
      description: Get fields on an Instagram photo, video, story, reel, or album.
      hints:
        readOnly: true
        idempotent: true
      call: instagram-graph.get-media
      with:
        media_id: tools.media_id
        fields: tools.fields
        access_token: tools.access_token
      outputParameters:
      - type: object
        mapping: $.
