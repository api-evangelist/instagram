specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Instagram
providerId: instagram
created: '2026-05-04'
# 2026-08-29: upgraded from method:generated (2026-05-04 bulk sweep) to method:searched, read from
# the Meta access-levels reference. Confirmed there: Standard Access is granted automatically on app
# creation and confines every permission to users holding a role on the app; Advanced Access opens
# them to any user and requires Business Verification (mandatory since 2023-02-01) plus per-permission
# App Review. Meta's access-levels page states no monetary cost of any kind, and there is no paid
# tier anywhere on the Instagram Platform - the gate is review, not money.
method: searched
modified: '2026-08-29'
generated: '2026-08-29'
source: https://developers.facebook.com/docs/graph-api/overview/access-levels
plan_count: 2
reconciled: true
tags:
  - Instagram
  - Meta
  - Social Media
  - Photos
description: The Instagram Platform APIs (Instagram Graph API, Instagram Login, Messenger / Conversations
  for Instagram, Business Discovery, Hashtag Search) are free to use. Access is gated by Meta App Review,
  with two access tiers - Standard Access (default; serves owned accounts only) and Advanced Access
  (required to serve non-owned accounts; needs App Review and Business Verification). There is no per-call
  fee; the only cost path is media storage / compute on the consuming app side.
sources:
  - https://developers.facebook.com/docs/graph-api/overview/access-levels
  - https://developers.facebook.com/docs/instagram-api/overview
  - https://developers.facebook.com/docs/graph-api/overview/rate-limiting/
  - https://developers.facebook.com/docs/app-review
plans:
  - id: instagram-standard-access
    name: Standard Access
    type: freemium
    description: Default access on app creation. Allows the app to serve only the developer's own / connected
      accounts. Free.
    entries:
      - label: Per-app calls
        description: Standard Access calls are subject to Meta Graph platform rate limits
        name: api_calls
        type: metered
        metric: request
        limit: -1
        timeFrame: usage
        geo: global
        domains:
          - https://graph.facebook.com
          - https://graph.instagram.com
        unit: 1
        price: '0.00'
        userMultiplied: false
    elements:
      - name: Instagram Graph API
      - name: Instagram Login
      - name: Owned-account scope only
      - name: Meta Graph platform rate limits
  - id: instagram-advanced-access
    name: Advanced Access
    type: freemium
    description: Required to serve accounts the app does not own. Requires Meta App Review approval and
      Business Verification. Free.
    entries:
      - label: Per-app calls
        description: Advanced Access calls are subject to Business Use Case (BUC) rate limits per Instagram
          account
        name: api_calls
        type: metered
        metric: request
        limit: -1
        timeFrame: usage
        geo: global
        domains:
          - https://graph.facebook.com
          - https://graph.instagram.com
        unit: 1
        price: '0.00'
        userMultiplied: false
    elements:
      - name: Instagram Graph API
      - name: Messenger / Conversations for Instagram
      - name: Business Discovery
      - name: Hashtag Search
      - name: App Review required
      - name: Business Verification required
