  note: Returned by mutations that have nothing to return - hide, delete.
observations:
- The model has almost no explicit foreign keys. Comment.parent_id is the only id-reference field
  in any schema; every other relationship is expressed as a URL edge. An agent cannot reconstruct
  the graph from a payload alone - it has to know the edge names.
- Media carries no owner id, so ownership is not resolvable from a media id.
- Four capabilities announced since 2026-04 (Audio, Collaborative Media, is_ai_generated, the new
  engagement counters) are absent from these schemas - see changelog/instagram-changelog.yml.
