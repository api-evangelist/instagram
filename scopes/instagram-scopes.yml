features:
- name: Instagram Public Content Access
  description: >-
    A FEATURE, not a permission, and a separate App Review item. Required in addition to
    instagram_basic for IG Hashtag Search.
  applies_to:
  - searchHashtag
  - getHashtagTopMedia
  - getHashtagRecentMedia
scope_count: 19
observations:
- The two permission families are not interchangeable. instagram_business_* only works with
  Instagram Login at graph.instagram.com; instagram_* only works with Facebook Login at
  graph.facebook.com.
- Hashtag search and business discovery are reachable ONLY through Facebook Login, and hashtag
  search additionally needs the Instagram Public Content Access feature approved.
- Every single instagram_* permission requires App Review. There is no read-only tier an app can
  self-serve into for other people's accounts.
