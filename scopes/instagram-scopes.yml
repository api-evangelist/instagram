method: searched
source: https://developers.facebook.com/docs/permissions
docs: https://developers.facebook.com/docs/permissions
description: >-
  Meta calls these "permissions", not scopes, but they are requested as OAuth 2.0 scopes in the
  authorization request. Upgraded 2026-08-29 from a 7-scope derivation off the OpenAPI
  securitySchemes to the full published reference - 19 instagram_* permissions plus the Facebook
  Page permissions an Instagram-with-Facebook-Login app also needs. EVERY instagram_* permission
  requires App Review to be used against accounts the app does not own.
schemes:
- name: oauth2
  source:
  - openapi/
  - https://developers.facebook.com/docs/permissions
  flows:
  - flow: authorizationCode
    login_model: Instagram API with Facebook Login
    authorizationUrl: https://www.facebook.com/dialog/oauth
    tokenUrl: https://graph.facebook.com/oauth/access_token
    base: https://graph.facebook.com
    scope_family: instagram_*
  - flow: authorizationCode
    login_model: Instagram API with Instagram Login
    authorizationUrl: https://www.instagram.com/oauth/authorize
    tokenUrl: https://api.instagram.com/oauth/access_token
    base: https://graph.instagram.com
    scope_family: instagram_business_*
  description: >-
    OAuth 2.0 authorization code. Two parallel login models with two distinct permission families -
    picking the wrong family for the host is the most common integration failure on this platform.
access_levels:
  standard: >-
    Granted automatically on app creation. The permission may only be requested from users who hold
    a role on the app (admin, developer, tester).
  advanced: >-
    Required to request the permission from any user. Needs App Review for the specific permission,
    plus Business Verification.
  source: https://developers.facebook.com/docs/graph-api/overview/access-levels
