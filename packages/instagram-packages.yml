source: https://developers.facebook.com/docs/business-sdk
description: >-
  Meta does not ship an Instagram-only client library. The Instagram Platform (Instagram
  Graph API / Instagram API with Instagram Login) is served by the Meta Business SDK, which
  Meta describes as covering "the Marketing API as well as many Facebook APIs from different
  platforms such as Pages, Business Manager, Instagram". The five packages below are the
  first-party distributions, published by the `facebook` GitHub org and versioned in lockstep
  with the Graph API version number (SDK v26.x == Graph API v26.0).
notes:
  - The SDK major version tracks the Graph API version, so the published version doubles as a
    currency signal - the Node.js and Java distributions are behind the Python/Ruby/PHP ones.
  - There is no first-party Instagram-specific SDK, CLI, or thin client. Instagram endpoints are
    reached through the Business SDK's generic Graph nodes/edges or by plain HTTPS.
