source: https://developers.facebook.com/docs/graph-api/guides/versioning
description: >-
  The Instagram Platform is versioned by the Meta Graph API version train. Instagram endpoints
  carry no version scheme of their own - the version in the path (for example /v26.0/) is the
  Graph API version, and Instagram's own changes are published in a separate Instagram Platform
  changelog that references those versions.
versioning:
  scheme: path-segment major.minor (v{N}.0) on the Graph API host
  example: https://graph.facebook.com/v26.0/ig_hashtag_search
  current_version: v26.0
  current_version_released: '2026-07-29'
  version_in_repo_specs: v21.0
  drift_note: >-
    The OpenAPI definitions in openapi/ describe Graph API v21.0. Live is v26.0 as of 2026-08-29 -
    five versions of drift. Meta auto-redirects calls to an expired version to "the next oldest,
    usable version" rather than failing, which hides the drift at runtime.
  unversioned_calls: >-
    A call with no version segment resolves to the version pinned in the app's dashboard settings,
    not to the newest version.
  version_pinning: >-
    An app can only call an older version if it had previously called that version. An app created
    after a version's release can never retroactively adopt it.
  source: https://developers.facebook.com/docs/graph-api/guides/versioning
deprecation:
