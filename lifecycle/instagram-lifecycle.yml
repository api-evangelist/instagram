  guarantee: >-
    Each version is supported for a minimum of two years. Precisely - a version stops being usable
    two years after the date the subsequent version is released.
  emergency_changes: >-
    Meta reserves the right to make emergency changes to any API for security or privacy reasons
    outside the two-year window.
